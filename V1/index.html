<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資訊卡拖曳系統</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="container container-a" data-group="A">
            <h2 class="container-header header-a">未整備</h2>
            <div class="card-list droppable">
                </div>
        </div>

        <div class="container container-b" data-group="B">
            <h2 class="container-header header-b">里民集合</h2>
            <div class="card-list droppable">
                </div>
        </div>

        <div class="container container-c" data-group="C">
            <h2 class="container-header header-c">已發車</h2>
            <div class="card-list droppable">
                </div>
        </div>

        <!-- 預備進站 -->
        <div class="container container-d" data-group="D">
            <h2 class="container-header header-d">預備進站</h2>
            <div class="card-list droppable">
                </div>
        </div>

        <div class="efg-column">
            <div class="container container-e" data-group="E">
                <h2 class="container-header header-e">準備進站</h2>
                <div class="slot-area">
                    <div class="slot-row">
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 1</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 2</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 3</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 4</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 5</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 6</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                    </div>
                     <div class="slot-row">
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 7</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                        <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 8</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                         <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 9</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                         <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 10</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                         <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 11</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                         <div class="slot slot-group-e">
                            <div class="slot-name" contenteditable="true">前站 12</div>
                            <div class="slot-dropzone droppable" data-group="E"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container container-f" data-group="F">
                <h2 class="container-header header-f">已到站</h2>
                 <div class="slot-area">
                    <div class="slot-row">
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 1</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 2</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 3</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 4</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 5</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 6</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                    </div>
                     <div class="slot-row">
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 7</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                        <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 8</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                         <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 9</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                         <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 10</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                         <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 11</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                         <div class="slot slot-group-f">
                            <div class="slot-name" contenteditable="true">前站 12</div>
                            <div class="slot-dropzone droppable" data-group="F"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container container-g" data-group="G">
                 <h2 class="container-header header-g">等待區</h2>
                 <div class="slot-area">
                    <div class="slot-row">
                        <div class="slot slot-group-g">
                            <div class="slot-name" contenteditable="true">等待區 1</div>
                            <div class="slot-dropzone droppable" data-group="G"></div>
                        </div>
                         <div class="slot slot-group-g">
                            <div class="slot-name" contenteditable="true">等待區 2</div>
                            <div class="slot-dropzone droppable" data-group="G"></div>
                        </div>
                         <div class="slot slot-group-g">
                            <div class="slot-name" contenteditable="true">等待區 3</div>
                            <div class="slot-dropzone droppable" data-group="G"></div>
                        </div>
                         <div class="slot slot-group-g">
                            <div class="slot-name" contenteditable="true">等待區 4</div>
                            <div class="slot-dropzone droppable" data-group="G"></div>
                        </div>
                         <div class="slot slot-group-g">
                            <div class="slot-name" contenteditable="true">等待區 5</div>
                            <div class="slot-dropzone droppable" data-group="G"></div>
                        </div>
                         <div class="slot slot-group-g">
                            <div class="slot-name" contenteditable="true">等待區 6</div>
                            <div class="slot-dropzone droppable" data-group="G"></div>
                        </div>
                        </div>
                </div>
            </div>
        </div>

        <div class="container container-h" data-group="H">
            <h2 class="container-header header-h">已離站</h2>
            <div class="card-list droppable">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
